<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PakGig - Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen px-4 py-12">

    <div class="max-w-md w-full text-center space-y-6">

        <!-- Logo -->
        <a href="index.html" class="text-2xl font-extrabold text-emerald-700 tracking-tight inline-block">Pak<span class="text-gray-900">Gig</span></a>

        <!-- Illustration -->
        <div class="flex justify-center">
            <svg width="180" height="140" viewBox="0 0 180 140" xmlns="http://www.w3.org/2000/svg">
                <circle cx="90" cy="70" r="60" fill="#ecfdf5"/>
                <text x="90" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="48" fill="#047857">404</text>
                <path d="M45 105 Q90 125 135 105" stroke="#a7f3d0" stroke-width="4" fill="none" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- Message -->
        <div class="space-y-2">
            <h1 class="text-xl font-bold text-gray-900">Page not found</h1>
            <p class="text-sm text-gray-500">The page you're looking for doesn't exist, may have been moved, or the link might be broken.</p>
        </div>

        <!-- Quick search -->
        <form id="searchForm" class="flex gap-2">
            <input type="text" id="searchInput" placeholder="Search for a service..." class="flex-1 px-3.5 py-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <button type="submit" class="px-5 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold rounded-lg shadow-md transition">Search</button>
        </form>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-3 justify-center pt-2">
            <a href="index.html" class="px-5 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold rounded-lg shadow-md transition">← Back to Home</a>
            <a href="Services.html" class="px-5 py-2.5 border border-gray-300 text-gray-700 text-sm font-semibold rounded-lg hover:bg-gray-50 transition">Browse Services</a>
        </div>

        <!-- Helpful links -->
        <div class="pt-6 border-t border-gray-100 text-xs text-gray-500 flex flex-wrap justify-center gap-x-4 gap-y-2">
            <a href="order.html" class="hover:text-emerald-700 hover:underline">My Orders</a>
            <a href="messages.html" class="hover:text-emerald-700 hover:underline">Messages</a>
            <a href="profile.html" class="hover:text-emerald-700 hover:underline">Profile</a>
            <a href="login.html" class="hover:text-emerald-700 hover:underline">Sign In</a>
        </div>
    </div>

    <script>
        document.getElementById("searchForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const q = document.getElementById("searchInput").value.trim();
            // Adjust the query param name to match whatever Services.html expects.
            window.location.href = "Services.html" + (q ? "?q=" + encodeURIComponent(q) : "");
        });
    </script>
</body>
</html>
