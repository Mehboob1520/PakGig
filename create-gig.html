<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - PakGig</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-12 px-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
    <div class="text-center mb-6">
      <a href="index.html" class="text-3xl font-extrabold text-emerald-700 tracking-tight">Pak<span class="text-gray-900">Gig</span></a>
      <h2 class="mt-3 text-xl font-bold text-gray-900">Create your account</h2>
      <p class="mt-1 text-xs text-gray-500">Join to hire freelancers or sell your services.</p>
    </div>

    <div id="alertBox" class="hidden p-3 rounded-lg text-xs font-medium border"></div>

    <form id="signupForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Full name</label>
        <input id="fullName" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Your full name" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Email address</label>
        <input type="email" id="email" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="you@example.com" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="At least 6 characters" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Role</label>
        <select id="role" class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          <option value="buyer">Buyer</option>
          <option value="seller">Seller</option>
        </select>
      </div>
      <button id="signupBtn" type="submit" class="w-full py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold rounded-lg shadow-md transition">Create account</button>
    </form>

    <div class="mt-5 text-center text-xs text-gray-600">
      Already have an account? <a href="login.html" class="font-semibold text-emerald-700 hover:underline">Sign In</a>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js';
    import { friendlyAuthError } from './js/session.js';

    const form = document.getElementById('signupForm');
    const alertBox = document.getElementById('alertBox');
    const signupBtn = document.getElementById('signupBtn');

    function showAlert(type, message) {
      const styles = type === 'success'
        ? 'bg-emerald-50 border-emerald-200 text-emerald-800'
        : 'bg-red-50 border-red-200 text-red-800';
      alertBox.className = 'p-3 rounded-lg text-xs font-medium border block ' + styles;
      alertBox.textContent = message;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating account...';
      alertBox.className = 'hidden';

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName,
            role
          }
        }
      });

      if (error) {
        showAlert('error', friendlyAuthError(error.message));
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create account';
        return;
      }

      if (data.user) {
        await supabase.from('profiles').upsert({
          id: data.user.id,
          email,
          full_name: fullName,
          role,
          status: 'active',
          created_at: new Date().toISOString()
        }, { onConflict: 'id' });
      }

      showAlert('success', 'Account created. Check your email to verify, then sign in.');
      signupBtn.disabled = false;
      signupBtn.textContent = 'Create account';
      form.reset();
    });
  </script>
</body>
</html>
