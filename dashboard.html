<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - PakGig</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:16px}
    .modal.show{display:flex}
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

<header class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <div class="flex items-center space-x-6">
      <a href="index.html" class="text-2xl font-extrabold text-emerald-700 tracking-tight">PakGig</a>
      <nav class="hidden md:flex space-x-4">
        <a href="Services.html" class="text-sm font-semibold text-gray-600 hover:text-emerald-700">Services</a>
      </nav>
    </div>
    <div class="flex items-center space-x-4">
      <a href="profile.html" class="text-sm font-semibold text-gray-600 hover:text-emerald-700">Profile</a>
      <button id="logout-btn" data-logout type="button" class="text-sm font-semibold text-red-600 hover:text-red-800">Logout</button>
      <a href="profile.html" id="navAvatar" title="My Profile" class="w-9 h-9 rounded-full bg-emerald-700 text-white flex items-center justify-center font-bold text-sm">U</a>
    </div>
  </div>
</header>


<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
  <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900" id="welcome">Welcome back!</h1>
      <p class="text-sm text-gray-500">Your orders, earnings and gigs in one place.</p>
    </div>
    <div class="flex gap-3">
      <a href="Services.html" class="inline-flex items-center justify-center border border-gray-300 text-gray-700 hover:bg-gray-50 text-sm font-semibold px-5 py-2.5 rounded-lg">Browse services</a>
      <a href="create-gig.html" id="createGigLink" class="inline-flex items-center justify-center bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold px-5 py-2.5 rounded-lg shadow-sm">+ Create New Gig</a>
    </div>
  </div>

  <div id="dashAlert" class="hidden p-3 rounded-lg text-xs font-medium border mb-6 bg-red-50 border-red-200 text-red-800"></div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm"><p class="text-xs font-semibold text-gray-400">Active orders</p><p class="text-3xl font-extrabold text-gray-900 mt-2" id="statActive">0</p></div>
    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm"><p class="text-xs font-semibold text-gray-400">Completed orders</p><p class="text-3xl font-extrabold text-gray-900 mt-2" id="statDone">0</p></div>
    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm"><p class="text-xs font-semibold text-gray-400" id="heldLabel">Held in escrow</p><p class="text-3xl font-extrabold text-amber-600 mt-2" id="statHeld">Rs. 0</p></div>
    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm"><p class="text-xs font-semibold text-gray-400">Available to withdraw</p><p class="text-3xl font-extrabold text-emerald-700 mt-2" id="statAvailable">Rs. 0</p><a href="escrow.html" class="text-xs font-semibold text-emerald-700 hover:underline">Payments &amp; withdrawals →</a></div>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
    <div class="flex items-center justify-between mb-4"><h2 class="text-lg font-bold text-gray-900">Recent orders</h2><a href="order.html" class="text-xs font-semibold text-emerald-700 hover:underline">View all →</a></div>
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm text-gray-600">
        <thead class="bg-gray-50 text-xs text-gray-400 border-b border-gray-200"><tr><th class="py-3 px-4">With</th><th class="py-3 px-4">Gig</th><th class="py-3 px-4">Due</th><th class="py-3 px-4">Amount</th><th class="py-3 px-4">Status</th><th class="py-3 px-4"></th></tr></thead>
        <tbody class="divide-y divide-gray-100" id="recentOrders"></tbody>
      </table>
    </div>
  </div>
</main>

<script type="module">
  import { requireLogin, bindLogout } from "./js/session.js";
  import { watchMyOrders, watchMyWithdrawals, getMyProfile } from "./js/data.js";
  import { esc, money, roleIn, STATUS_META, sellerTotals, buyerHeld } from "./js/ledger.js";

  bindLogout("index.html");

  const $ = (id) => document.getElementById(id);
  let me = null, profile = { role: "buyer" }, orders = [], withdrawals = [];

  function isSeller() { return profile.role === "seller" || profile.role === "admin"; }

  function render() {
    $("statActive").textContent = orders.filter((o) => ["pending", "in_progress", "delivered"].includes(o.status)).length;
    $("statDone").textContent = orders.filter((o) => o.status === "completed").length;

    if (isSeller()) {
      const t = sellerTotals(orders, withdrawals, me.uid);
      $("heldLabel").textContent = "Pending clearance";
      $("statHeld").textContent = money(t.held);
      $("statAvailable").textContent = money(t.available);
    } else {
      $("heldLabel").textContent = "Held in escrow";
      $("statHeld").textContent = money(buyerHeld(orders, me.uid));
      $("statAvailable").textContent = money(0);
    }

    $("recentOrders").innerHTML = orders.slice(0, 6).map((o) => {
      const s = STATUS_META[o.status] || STATUS_META.pending;
      const other = roleIn(o, me.uid) === "seller" ? o.buyerName : o.sellerName;
      return `<tr>
        <td class="py-3 px-4 font-medium text-gray-900">${esc(other)}</td>
        <td class="py-3 px-4">${esc(o.title)}</td>
        <td class="py-3 px-4">${esc(o.due)}</td>
        <td class="py-3 px-4 font-semibold text-gray-900">${money(o.amount)}</td>
        <td class="py-3 px-4"><span class="text-[11px] font-semibold px-2 py-0.5 rounded-full border ${s.badge}">${esc(s.label)}</span></td>
        <td class="py-3 px-4 text-right"><a href="order.html?order=${encodeURIComponent(o.id)}" class="text-xs font-semibold text-emerald-700 hover:underline">Open →</a></td>
      </tr>`;
    }).join("") || `<tr><td colspan="6" class="py-8 px-4 text-center text-gray-400 text-xs">No orders yet. <a href="Services.html" class="text-emerald-700 font-semibold hover:underline">Browse services</a> to place your first one.</td></tr>`;
  }

  requireLogin().then(async (res) => {
    me = res.user;
    const name = (me.displayName || me.email || "").trim();
    $("navAvatar").textContent = name ? name.charAt(0).toUpperCase() : "U";
    $("welcome").textContent = "Welcome back, " + (name.split(" ")[0] || "there") + "!";
    try { profile = await getMyProfile(me); } catch (e) {}

    const onError = () => {
      const box = $("dashAlert");
      box.textContent = "Could not load your data. Check your connection and that the Firestore rules are published.";
      box.classList.remove("hidden");
    };
    watchMyOrders(me.uid, (data) => { orders = data; render(); }, onError);
    if (isSeller()) watchMyWithdrawals(me.uid, (data) => { withdrawals = data; render(); }, onError);
    render();
  });
</script>
</body>
</html>
