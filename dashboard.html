<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - PakGig</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-extrabold text-emerald-700 tracking-tight">PakGig</a>
      
      <div class="flex items-center space-x-6">
        <a href="Services.html" class="text-sm font-semibold text-gray-600 hover:text-emerald-700">Services</a>
        <button id="logout-btn" class="text-sm font-semibold text-red-600 hover:text-red-800">Logout</button>
        <div class="w-9 h-9 rounded-full bg-emerald-700 text-white flex items-center justify-center font-bold text-sm">
          M
        </div>
      </div>
    </div>
  </header>

  <!-- Dashboard Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Welcome Back, Freelancer!</h1>
      <p class="text-sm text-gray-500">Manage your services, active orders, and earnings here.</p>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Active Orders</p>
        <p class="text-3xl font-extrabold text-gray-900 mt-2">3</p>
      </div>
      <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Completed Gigs</p>
        <p class="text-3xl font-extrabold text-gray-900 mt-2">12</p>
      </div>
      <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Earnings</p>
        <p class="text-3xl font-extrabold text-emerald-600 mt-2">PKR 45,000</p>
      </div>
    </div>

    <!-- Active Gigs / Services -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-gray-900">Your Posted Services</h2>
        <a href="Services.html" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-semibold px-4 py-2 rounded-lg">Add New Gig</a>
      </div>
      <div class="border-t border-gray-100 pt-4 text-sm text-gray-500">
        You currently have active gigs listed on the marketplace.
      </div>
    </div>
  </main>

  <!-- Auth Script & Logout Logic -->
  <script>
    // Security Guard: Check if logged in
    const isLoggedIn = localStorage.getItem("userLoggedIn");
    if (isLoggedIn !== "true") {
      window.location.href = "login.html";
    }

    // Logout Functionality
    document.getElementById("logout-btn").addEventListener("click", function() {
      localStorage.removeItem("userLoggedIn");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
