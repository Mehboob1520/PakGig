<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - PakGig</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-extrabold text-emerald-700 tracking-tight">Pak<span class="text-gray-900">Gig</span></a>
      <a href="dashboard.html" class="text-sm font-semibold text-gray-600 hover:text-emerald-700">Dashboard</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Admin Panel</h1>
      <p class="text-sm text-gray-500 mb-6">Manage users and account status.</p>

      <div id="usersTable" class="overflow-x-auto"></div>
    </div>
  </main>

  <script type="module">
    import { requireLogin } from './js/session.js';
    import { listUsers, setUserStatus } from './js/data.js';

    const usersTable = document.getElementById('usersTable');

    requireLogin({ adminOnly: true }).then(async () => {
      const users = await listUsers();
      usersTable.innerHTML = `
        <table class="w-full text-left text-sm text-gray-600">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="py-3 px-4">Name</th>
              <th class="py-3 px-4">Email</th>
              <th class="py-3 px-4">Role</th>
              <th class="py-3 px-4">Status</th>
              <th class="py-3 px-4">Action</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            ${users.map((user) => `
              <tr>
                <td class="py-3 px-4 font-medium text-gray-900">${user.fullName || '—'}</td>
                <td class="py-3 px-4">${user.email || '—'}</td>
                <td class="py-3 px-4">${user.role || 'buyer'}</td>
                <td class="py-3 px-4">${user.status || 'active'}</td>
                <td class="py-3 px-4">
                  <button data-user-id="${user.id}" data-status="blocked" class="statusBtn text-xs font-semibold text-red-600 hover:text-red-800">Block</button>
                  <button data-user-id="${user.id}" data-status="active" class="statusBtn text-xs font-semibold text-emerald-700 hover:text-emerald-800 ml-2">Activate</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      document.querySelectorAll('.statusBtn').forEach((button) => {
        button.addEventListener('click', async () => {
          await setUserStatus(button.dataset.userId, button.dataset.status);
          window.location.reload();
        });
      });
    });
  </script>
</body>
</html>
