<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PakGig - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-12 px-4">

    <div class="max-w-md w-full space-y-6 bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <!-- Logo -->
        <div class="text-center space-y-2">
            <a href="index.html" class="text-3xl font-extrabold text-emerald-700 tracking-tight inline-block">Pak<span class="text-gray-900">Gig</span></a>
            <h2 class="text-xl font-bold text-gray-900">Welcome back</h2>
            <p class="text-xs text-gray-500">Sign in to manage your orders & escrow funds</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="hidden p-3 rounded-lg text-xs font-medium border"></div>

        <!-- Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" id="loginEmail" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="name@example.com">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-gray-700">Password</label>
                    <button type="button" id="forgotBtn" class="text-xs text-emerald-700 hover:underline">Forgot password?</button>
                </div>
                <input type="password" id="loginPassword" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="••••••••">
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" id="remember" checked class="w-4 h-4 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500">
                <label for="remember" class="text-xs text-gray-600">Remember me on this device</label>
            </div>

            <button type="submit" id="loginBtn" class="w-full py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold rounded-lg shadow-md transition">
                Sign In
            </button>
        </form>

        <div class="text-center text-xs text-gray-600">
            Don't have a PakGig account? <a href="signup.html" class="font-semibold text-emerald-700 hover:underline">Join Free</a>
        </div>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-gray-400 hover:text-gray-600">← Back to Home Page</a>
        </div>
    </div>

    <script type="module">
        import { supabase } from "./js/supabaseClient.js";
        import { friendlyAuthError } from "./js/session.js";

        const alertBox = document.getElementById("alertBox");
        const loginBtn = document.getElementById("loginBtn");
        const emailInput = document.getElementById("loginEmail");
        const passwordInput = document.getElementById("loginPassword");

        function showAlert(type, message) {
            const styles = type === "success"
                ? "bg-emerald-50 border-emerald-200 text-emerald-800"
                : "bg-red-50 border-red-200 text-red-800";
            alertBox.className = "p-3 rounded-lg text-xs font-medium border block " + styles;
            alertBox.textContent = message;
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            loginBtn.disabled = true;
            loginBtn.textContent = "Authenticating...";
            alertBox.className = "hidden";

            const { error } = await supabase.auth.signInWithPassword({
                email: emailInput.value.trim(),
                password: passwordInput.value
            });

            if (error) {
                showAlert("error", friendlyAuthError(error.message));
                loginBtn.disabled = false;
                loginBtn.textContent = "Sign In";
                return;
            }

            showAlert("success", "Logged in successfully! Redirecting...");
            setTimeout(() => { window.location.href = "Services.html"; }, 600);
        });

        document.getElementById("forgotBtn").addEventListener("click", async () => {
            const email = emailInput.value.trim();
            if (!email) {
                showAlert("error", "Enter your email above first, then press Forgot password.");
                return;
            }
            const { error } = await supabase.auth.resetPasswordForEmail(email);
            if (error) {
                showAlert("error", friendlyAuthError(error.message));
            } else {
                showAlert("success", "If an account exists for this email, a reset link has been sent.");
            }
        });
    </script>
</body>
</html>
