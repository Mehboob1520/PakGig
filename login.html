<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PakGig - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-12 px-4">

    <div class="max-w-md w-full space-y-6 bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <!-- Logo -->
        <div class="text-center space-y-2">
            <a href="index.html" class="text-3xl font-extrabold text-emerald-700 tracking-tight inline-block">Pak<span class="text-gray-900">Gig</span></a>
            <h2 class="text-xl font-bold text-gray-900">Welcome back</h2>
            <p class="text-xs text-gray-500">Sign in to manage your orders & escrow funds</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="hidden p-3 rounded-lg text-xs font-medium border"></div>

        <!-- Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" id="loginEmail" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="name@example.com">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-gray-700">Password</label>
                    <a href="#" class="text-xs text-emerald-700 hover:underline">Forgot password?</a>
                </div>
                <input type="password" id="loginPassword" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="••••••••">
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" id="remember" class="w-4 h-4 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500">
                <label for="remember" class="text-xs text-gray-600">Remember me on this device</label>
            </div>

            <button type="submit" id="loginBtn" class="w-full py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold rounded-lg shadow-md transition">
                Sign In
            </button>
        </form>

        <div class="text-center text-xs text-gray-600">
            Don't have a PakGig account? <a href="signup.html" class="font-semibold text-emerald-700 hover:underline">Join Free</a>
        </div>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-gray-400 hover:text-gray-600">← Back to Home Page</a>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.innerHTML = "Authenticating...";

            setTimeout(() => {
                alertBox.className = "p-3 rounded-lg text-xs font-medium border bg-emerald-50 border-emerald-200 text-emerald-800 block";
                alertBox.innerHTML = "Logged in successfully! Redirecting...";

                setTimeout(() => {
                    window.location.href = "Services.html";
                }, 1200);
            }, 1000);
        }
    </script>
</body>
</html>
