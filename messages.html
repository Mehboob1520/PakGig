<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages - PakGig</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="dashboard.html" class="text-2xl font-extrabold text-emerald-700 tracking-tight">Pak<span class="text-gray-900">Gig</span></a>
      <a href="dashboard.html" class="text-sm font-semibold text-gray-600 hover:text-emerald-700">Dashboard</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
      <div class="border-b border-gray-200 px-5 py-4">
        <h1 class="text-xl font-bold text-gray-900">Messages</h1>
      </div>

      <div id="messageList" class="h-[420px] overflow-y-auto p-5 space-y-3 bg-gray-50"></div>

      <div class="border-t border-gray-200 p-4 flex gap-3">
        <input id="messageInput" type="text" placeholder="Type your message..." class="flex-1 px-3.5 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        <button id="sendBtn" class="bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold px-5 py-2.5 rounded-lg">Send</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { requireLogin } from './js/session.js';
    import { watchMyOrders, watchMessages, sendMessage } from './js/data.js';

    const messageList = document.getElementById('messageList');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    requireLogin().then(async ({ user }) => {
      const params = new URLSearchParams(window.location.search);
      const wantedId = params.get('order');
      let selectedOrder = null;
      let stopWatching = null;

      // Send handlers are attached once (not every time orders refresh).
      sendBtn.onclick = async () => {
        const text = input.value.trim();
        if (!text || !selectedOrder) return;
        sendBtn.disabled = true;
        try {
          await sendMessage(selectedOrder.id, user, user.user_metadata?.full_name || user.email || 'User', text);
          input.value = '';
        } catch (err) {
          alert(err?.message || 'Could not send message.');
        } finally {
          sendBtn.disabled = false;
        }
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendBtn.click();
      });

      watchMyOrders(user.id, (orders) => {
        if (!orders.length) {
          messageList.innerHTML = '<div class="text-sm text-gray-500">No orders available for chat yet.</div>';
          return;
        }

        const chosen = selectedOrder
          ? orders.find((o) => o.id === selectedOrder.id)
          : (orders.find((o) => o.id === wantedId) || orders[0]);
        if (!chosen) return;

        // Already watching this order's messages: nothing more to do.
        if (selectedOrder && selectedOrder.id === chosen.id && stopWatching) return;

        selectedOrder = chosen;
        if (stopWatching) stopWatching();
        stopWatching = watchMessages(selectedOrder.id, (messages) => {
          messageList.innerHTML = messages.map((m) => {
            const mine = m.senderId === user.id;
            return `
              <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
                <div class="max-w-[80%] rounded-xl px-3 py-2 text-sm ${mine ? 'bg-emerald-700 text-white' : 'bg-white border border-gray-200 text-gray-800'}">
                  <div class="font-semibold text-[11px] opacity-80 mb-1">${esc(m.senderName) || 'User'}</div>
                  <div>${esc(m.text)}</div>
                </div>
              </div>
            `;
          }).join('');
          messageList.scrollTop = messageList.scrollHeight;
        });
      });
    });
  </script>
</body>
</html>
