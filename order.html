<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders - PakGig</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="dashboard.html" class="text-2xl font-extrabold text-emerald-700 tracking-tight">Pak<span class="text-gray-900">Gig</span></a>
      <a href="dashboard.html" class="text-sm font-semibold text-gray-600 hover:text-emerald-700">Dashboard</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Your order</h1>
      <p class="text-sm text-gray-500 mb-6">Track progress, status, and order history.</p>

      <div id="orderContent" class="space-y-4"></div>
    </div>
  </main>

  <script type="module">
    import { requireLogin } from './js/session.js';
    import { watchMyOrders, orderAction } from './js/data.js';

    const orderContent = document.getElementById('orderContent');

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    requireLogin().then(({ user }) => {
      const params = new URLSearchParams(window.location.search);
      const targetId = params.get('order');

      watchMyOrders(user.id, (orders) => {
        const order = orders.find((o) => o.id === targetId) || orders[0];

        if (!order) {
          orderContent.innerHTML = '<div class="text-sm text-gray-500">No order found.</div>';
          return;
        }

        const isSeller = user.id === order.sellerId;
        const isBuyer = user.id === order.buyerId;
        const openDispute = order.disputed && order.disputeStatus === 'open';

        // Buttons shown depend on who you are and what stage the order is in.
        const actions = [];
        if (!openDispute) {
          if (isSeller && order.status === 'in_progress' && order.escrow === 'held') {
            actions.push({ label: 'Mark Delivered', value: 'deliver' });
          }
          if (isBuyer && order.status === 'delivered' && order.escrow === 'held') {
            actions.push({ label: 'Accept & Release Payment', value: 'release' });
            actions.push({ label: 'Request Revision', value: 'revision' });
          }
        }
        if (isBuyer && order.status === 'pending' && order.escrow === 'awaiting') {
          actions.push({ label: 'Cancel Order', value: 'cancel' });
        }

        let note = '';
        if (openDispute) note = 'A dispute is open on this order. Our team will review it.';
        else if (order.status === 'pending' && order.escrow === 'awaiting') note = 'Waiting for payment to be confirmed.';

        orderContent.innerHTML = `
          <div class="border border-gray-200 rounded-xl p-5">
            <div class="flex items-center justify-between gap-4 mb-4">
              <div>
                <div class="text-xs uppercase tracking-wide font-semibold text-emerald-700">${esc(order.status)}</div>
                <h2 class="text-xl font-bold text-gray-900 mt-1">${esc(order.title)}</h2>
              </div>
              <div class="text-right">
                <div class="text-xs text-gray-500">Amount</div>
                <div class="text-xl font-bold text-gray-900">PKR ${Number(order.amount).toLocaleString()}</div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm text-gray-600">
              <div class="bg-gray-50 p-3 rounded-lg"><div class="text-xs text-gray-500">Buyer</div><div class="font-semibold text-gray-900">${esc(order.buyerName) || '—'}</div></div>
              <div class="bg-gray-50 p-3 rounded-lg"><div class="text-xs text-gray-500">Seller</div><div class="font-semibold text-gray-900">${esc(order.sellerName) || '—'}</div></div>
              <div class="bg-gray-50 p-3 rounded-lg"><div class="text-xs text-gray-500">Escrow</div><div class="font-semibold text-gray-900">${esc(order.escrow) || 'Not set'}</div></div>
            </div>

            ${note ? `<p class="mt-4 text-xs text-gray-500">${esc(note)}</p>` : ''}

            <div class="mt-5 flex flex-wrap gap-3">
              ${actions.map((a) => `<button data-action="${a.value}" class="actionBtn bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold px-4 py-2 rounded-lg">${a.label}</button>`).join('')}
            </div>
          </div>
        `;

        document.querySelectorAll('.actionBtn').forEach((button) => {
          button.addEventListener('click', async () => {
            button.disabled = true;
            try {
              await orderAction(order.id, button.dataset.action);
              window.location.reload();
            } catch (err) {
              button.disabled = false;
              alert(err?.message || 'Could not update order.');
            }
          });
        });
      });
    });
  </script>
</body>
</html>
