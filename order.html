<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PakGig - My Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Top Nav -->
    <nav class="bg-white border-b border-gray-100 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="text-xl font-extrabold text-emerald-700 tracking-tight">Pak<span class="text-gray-900">Gig</span></a>
            <div class="flex items-center gap-5 text-sm font-medium text-gray-600">
                <a href="Services.html" class="hover:text-emerald-700">Services</a>
                <a href="order.html" class="text-emerald-700">Orders</a>
                <a href="profile.html" class="hover:text-emerald-700">Profile</a>
                <a href="login.html" class="hover:text-red-600">Logout</a>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">

        <div id="alertBox" class="hidden p-3 rounded-lg text-xs font-medium border"></div>

        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-gray-900">My Orders</h1>
                <p class="text-xs text-gray-500 mt-1">Track your orders and escrow-protected payments</p>
            </div>

            <!-- Filter tabs -->
            <div class="flex gap-1 bg-white border border-gray-200 rounded-lg p-1 text-xs font-semibold" id="filterTabs">
                <button data-filter="all" class="filter-btn px-3 py-1.5 rounded-md bg-emerald-700 text-white">All</button>
                <button data-filter="active" class="filter-btn px-3 py-1.5 rounded-md text-gray-600 hover:bg-gray-50">Active</button>
                <button data-filter="delivered" class="filter-btn px-3 py-1.5 rounded-md text-gray-600 hover:bg-gray-50">Delivered</button>
                <button data-filter="completed" class="filter-btn px-3 py-1.5 rounded-md text-gray-600 hover:bg-gray-50">Completed</button>
                <button data-filter="cancelled" class="filter-btn px-3 py-1.5 rounded-md text-gray-600 hover:bg-gray-50">Cancelled</button>
            </div>
        </div>

        <!-- Orders list -->
        <div id="ordersList" class="space-y-4"></div>

        <!-- Empty state -->
        <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-gray-100">
            <p class="text-sm text-gray-500">No orders in this category yet.</p>
        </div>
    </main>

    <!-- Order Detail Modal -->
    <div id="orderModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/50 px-4 py-8 overflow-y-auto">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-6 space-y-5 my-auto">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <p class="text-xs text-gray-400" id="modalOrderId">Order #—</p>
                    <h3 class="text-base font-bold text-gray-900" id="modalTitle">Service title</h3>
                </div>
                <button type="button" id="closeModal" aria-label="Close" class="text-gray-400 hover:text-gray-700 text-lg leading-none">&times;</button>
            </div>

            <div id="modalAlert" class="hidden p-3 rounded-lg text-xs font-medium border"></div>

            <!-- Timeline -->
            <div class="flex items-center justify-between text-[11px] text-gray-500" id="modalTimeline">
                <!-- filled by JS -->
            </div>

            <!-- Info grid -->
            <div class="grid grid-cols-2 gap-3 text-sm bg-gray-50 rounded-xl p-4">
                <div>
                    <p class="text-[11px] text-gray-500">Seller / Buyer</p>
                    <p class="font-semibold text-gray-900" id="modalParty">—</p>
                </div>
                <div>
                    <p class="text-[11px] text-gray-500">Order Amount</p>
                    <p class="font-semibold text-gray-900" id="modalAmount">Rs. 0</p>
                </div>
                <div>
                    <p class="text-[11px] text-gray-500">Escrow Status</p>
                    <p class="font-semibold" id="modalEscrow">—</p>
                </div>
                <div>
                    <p class="text-[11px] text-gray-500">Due Date</p>
                    <p class="font-semibold text-gray-900" id="modalDue">—</p>
                </div>
            </div>

            <!-- Actions (shown conditionally per status) -->
            <div class="flex flex-wrap gap-2" id="modalActions"></div>
        </div>
    </div>

    <script>
        // Demo data — replace with a real GET /api/orders call to your backend.
        let orders = JSON.parse(localStorage.getItem("pakgigOrders") || "null") || [
            {
                id: "PG-10234",
                title: "Modern Logo Design for PakGig",
                party: "Seller: Bilal Ahmed",
                amount: 8000,
                status: "in_progress", // pending, in_progress, delivered, completed, cancelled
                escrow: "held",        // held, released, refunded
                due: "2026-09-25"
            },
            {
                id: "PG-10221",
                title: "WordPress Business Website (5 pages)",
                party: "Seller: Sana Malik",
                amount: 35000,
                status: "delivered",
                escrow: "held",
                due: "2026-09-20"
            },
            {
                id: "PG-10190",
                title: "SEO Audit & On-Page Optimization",
                party: "Seller: Usman Tariq",
                amount: 12000,
                status: "completed",
                escrow: "released",
                due: "2026-09-05"
            },
            {
                id: "PG-10177",
                title: "Urdu Voiceover for Ad (60 sec)",
                party: "Seller: Ayesha Noor",
                amount: 4000,
                status: "cancelled",
                escrow: "refunded",
                due: "2026-08-30"
            }
        ];

        const statusMeta = {
            pending:     { label: "Pending",     badge: "bg-gray-100 text-gray-700 border-gray-200" },
            in_progress: { label: "In Progress", badge: "bg-blue-50 text-blue-700 border-blue-200" },
            delivered:   { label: "Delivered",   badge: "bg-amber-50 text-amber-700 border-amber-200" },
            completed:   { label: "Completed",   badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
            cancelled:   { label: "Cancelled",   badge: "bg-red-50 text-red-700 border-red-200" }
        };

        const escrowMeta = {
            held:     { label: "Held in Escrow", color: "text-amber-700" },
            released: { label: "Released",       color: "text-emerald-700" },
            refunded: { label: "Refunded",        color: "text-gray-600" }
        };

        const steps = ["pending", "in_progress", "delivered", "completed"];

        let currentFilter = "all";
        let activeOrderId = null;

        function saveOrders() {
            localStorage.setItem("pakgigOrders", JSON.stringify(orders));
        }

        function money(n) {
            return "Rs. " + Number(n).toLocaleString();
        }

        function renderOrders() {
            const list = document.getElementById("ordersList");
            const empty = document.getElementById("emptyState");

            const filtered = orders.filter(o => currentFilter === "all" ? true : o.status === currentFilter);

            if (filtered.length === 0) {
                list.innerHTML = "";
                empty.classList.remove("hidden");
                return;
            }
            empty.classList.add("hidden");

            list.innerHTML = filtered.map(o => {
                const s = statusMeta[o.status];
                const e = escrowMeta[o.escrow];
                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 flex flex-col sm:flex-row sm:items-center gap-4 hover:shadow-md transition">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="text-xs text-gray-400">#${o.id}</span>
                            <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full border ${s.badge}">${s.label}</span>
                        </div>
                        <h3 class="font-semibold text-gray-900 text-sm mt-1 truncate">${o.title}</h3>
                        <p class="text-xs text-gray-500 mt-0.5">${o.party} &middot; Due ${o.due}</p>
                    </div>
                    <div class="text-right shrink-0">
                        <p class="font-bold text-gray-900 text-sm">${money(o.amount)}</p>
                        <p class="text-[11px] ${e.color} font-medium">${e.label}</p>
                    </div>
                    <button data-id="${o.id}" class="viewOrderBtn shrink-0 px-4 py-2 text-xs font-semibold rounded-lg border border-emerald-700 text-emerald-700 hover:bg-emerald-50 transition">
                        View Details
                    </button>
                </div>`;
            }).join("");

            document.querySelectorAll(".viewOrderBtn").forEach(btn => {
                btn.addEventListener("click", () => openOrderModal(btn.dataset.id));
            });
        }

        function renderTimeline(status) {
            const idx = status === "cancelled" ? -1 : steps.indexOf(status);
            const labels = { pending: "Placed", in_progress: "In Progress", delivered: "Delivered", completed: "Completed" };

            return steps.map((step, i) => {
                const done = status === "cancelled" ? false : i <= idx;
                const dotColor = done ? "bg-emerald-600" : "bg-gray-200";
                const textColor = done ? "text-emerald-700 font-semibold" : "text-gray-400";
                const line = i < steps.length - 1
                    ? `<div class="flex-1 h-0.5 ${i < idx ? 'bg-emerald-600' : 'bg-gray-200'} mx-1"></div>`
                    : "";
                return `
                    <div class="flex items-center flex-1">
                        <div class="flex flex-col items-center gap-1">
                            <div class="w-2.5 h-2.5 rounded-full ${dotColor}"></div>
                            <span class="${textColor}">${labels[step]}</span>
                        </div>
                        ${line}
                    </div>`;
            }).join("") + (status === "cancelled" ? `<span class="text-red-600 font-semibold ml-2">Cancelled</span>` : "");
        }

        function renderActions(order) {
            const btns = [];

            if (order.status === "delivered") {
                btns.push(`<button id="releaseBtn" class="px-4 py-2 text-xs font-semibold rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white transition">Release Payment</button>`);
                btns.push(`<button id="revisionBtn" class="px-4 py-2 text-xs font-semibold rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 transition">Request Revision</button>`);
            }
            if (order.status === "pending" || order.status === "in_progress") {
                btns.push(`<button id="cancelBtn" class="px-4 py-2 text-xs font-semibold rounded-lg border border-red-200 text-red-600 hover:bg-red-50 transition">Cancel Order</button>`);
            }
            if (order.status !== "completed" && order.status !== "cancelled") {
                btns.push(`<button id="disputeBtn" class="px-4 py-2 text-xs font-semibold rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 transition">Open Dispute</button>`);
            }
            btns.push(`<a href="messages.html?order=${order.id}" class="px-4 py-2 text-xs font-semibold rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 transition">Message ${order.party.startsWith('Seller') ? 'Seller' : 'Buyer'}</a>`);

            return btns.join("");
        }

        function openOrderModal(id) {
            const order = orders.find(o => o.id === id);
            if (!order) return;
            activeOrderId = id;

            document.getElementById("modalAlert").className = "hidden";
            document.getElementById("modalOrderId").textContent = "Order #" + order.id;
            document.getElementById("modalTitle").textContent = order.title;
            document.getElementById("modalParty").textContent = order.party;
            document.getElementById("modalAmount").textContent = money(order.amount);
            document.getElementById("modalDue").textContent = order.due;

            const e = escrowMeta[order.escrow];
            const escrowEl = document.getElementById("modalEscrow");
            escrowEl.textContent = e.label;
            escrowEl.className = "font-semibold " + e.color;

            document.getElementById("modalTimeline").innerHTML = renderTimeline(order.status);
            document.getElementById("modalActions").innerHTML = renderActions(order);

            attachActionHandlers(order);

            const modal = document.getElementById("orderModal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeOrderModal() {
            const modal = document.getElementById("orderModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
            activeOrderId = null;
        }

        function showModalAlert(type, msg) {
            const box = document.getElementById("modalAlert");
            const styles = type === "success"
                ? "bg-emerald-50 border-emerald-200 text-emerald-800"
                : "bg-red-50 border-red-200 text-red-800";
            box.className = "p-3 rounded-lg text-xs font-medium border block " + styles;
            box.innerHTML = msg;
        }

        function updateOrder(id, changes) {
            orders = orders.map(o => o.id === id ? { ...o, ...changes } : o);
            saveOrders();
        }

        function attachActionHandlers(order) {
            const releaseBtn  = document.getElementById("releaseBtn");
            const revisionBtn = document.getElementById("revisionBtn");
            const cancelBtn   = document.getElementById("cancelBtn");
            const disputeBtn  = document.getElementById("disputeBtn");

            if (releaseBtn) releaseBtn.addEventListener("click", () => {
                if (!confirm("Release escrow payment to the seller? This confirms you're satisfied with the delivery.")) return;
                // demo only — replace with: fetch(`/api/orders/${order.id}/release`, { method: 'POST' })
                updateOrder(order.id, { status: "completed", escrow: "released" });
                showModalAlert("success", "Payment released. Order marked as completed.");
                renderOrders();
                setTimeout(() => openOrderModal(order.id), 900);
            });

            if (revisionBtn) revisionBtn.addEventListener("click", () => {
                // demo only — replace with: fetch(`/api/orders/${order.id}/revision`, { method: 'POST' })
                updateOrder(order.id, { status: "in_progress" });
                showModalAlert("success", "Revision requested. The seller has been notified.");
                renderOrders();
                setTimeout(() => openOrderModal(order.id), 900);
            });

            if (cancelBtn) cancelBtn.addEventListener("click", () => {
                if (!confirm("Cancel this order? Escrow funds will be refunded.")) return;
                // demo only — replace with: fetch(`/api/orders/${order.id}/cancel`, { method: 'POST' })
                updateOrder(order.id, { status: "cancelled", escrow: "refunded" });
                showModalAlert("success", "Order cancelled and payment refunded.");
                renderOrders();
                setTimeout(() => openOrderModal(order.id), 900);
            });

            if (disputeBtn) disputeBtn.addEventListener("click", () => {
                // demo only — replace with: fetch(`/api/orders/${order.id}/dispute`, { method: 'POST' })
                showModalAlert("success", "Dispute opened. Our support team will review this order within 24 hours.");
            });
        }

        // Filter tabs
        document.getElementById("filterTabs").addEventListener("click", (e) => {
            const btn = e.target.closest(".filter-btn");
            if (!btn) return;
            currentFilter = btn.dataset.filter;

            document.querySelectorAll(".filter-btn").forEach(b => {
                b.classList.remove("bg-emerald-700", "text-white");
                b.classList.add("text-gray-600");
            });
            btn.classList.add("bg-emerald-700", "text-white");
            btn.classList.remove("text-gray-600");

            renderOrders();
        });

        document.getElementById("closeModal").addEventListener("click", closeOrderModal);
        document.getElementById("orderModal").addEventListener("click", (e) => {
            if (e.target.id === "orderModal") closeOrderModal();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && activeOrderId) closeOrderModal();
        });

        renderOrders();
    </script>
</body>
</html>
