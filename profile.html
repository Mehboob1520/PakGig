<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile - PakGig</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="dashboard.html" class="text-2xl font-extrabold text-emerald-700 tracking-tight">Pak<span class="text-gray-900">Gig</span></a>
      <a href="dashboard.html" class="text-sm font-semibold text-gray-600 hover:text-emerald-700">Back to Dashboard</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-10">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
      <h1 class="text-2xl font-bold text-gray-900 mb-2">My Profile</h1>
      <p class="text-sm text-gray-500 mb-6">Update your public profile and contact details.</p>

      <div id="alertBox" class="hidden p-3 rounded-lg text-xs font-medium border mb-6"></div>

      <form id="profileForm" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Full name</label>
          <input id="fullName" class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Tagline</label>
          <input id="tagline" class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Short description" />
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Phone</label>
            <input id="phone" class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="03XX1234567" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">City</label>
            <input id="city" class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Lahore" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Skills</label>
          <input id="skills" class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Web Design, SEO, React" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Bio</label>
          <textarea id="bio" rows="5" class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Tell buyers about yourself"></textarea>
        </div>
        <button type="submit" id="saveBtn" class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold rounded-lg shadow-md transition">Save profile</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { requireLogin } from './js/session.js';
    import { getMyProfile, updateMyProfile } from './js/data.js';

    const form = document.getElementById('profileForm');
    const alertBox = document.getElementById('alertBox');
    const saveBtn = document.getElementById('saveBtn');

    function showAlert(type, message) {
      const styles = type === 'success'
        ? 'bg-emerald-50 border-emerald-200 text-emerald-800'
        : 'bg-red-50 border-red-200 text-red-800';
      alertBox.className = 'p-3 rounded-lg text-xs font-medium border block ' + styles;
      alertBox.textContent = message;
    }

    requireLogin().then(async ({ user }) => {
      const profile = await getMyProfile(user);
      document.getElementById('fullName').value = profile.fullName || '';
      document.getElementById('tagline').value = profile.tagline || '';
      document.getElementById('phone').value = profile.phone || '';
      document.getElementById('city').value = profile.city || '';
      document.getElementById('skills').value = Array.isArray(profile.skills) ? profile.skills.join(', ') : (profile.skills || '');
      document.getElementById('bio').value = profile.bio || '';

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';

        try {
          await updateMyProfile(user, {
            fullName: document.getElementById('fullName').value.trim(),
            tagline: document.getElementById('tagline').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            city: document.getElementById('city').value.trim(),
            skills: document.getElementById('skills').value.split(',').map((s) => s.trim()).filter(Boolean),
            bio: document.getElementById('bio').value.trim()
          });
          showAlert('success', 'Profile updated successfully.');
        } catch (err) {
          showAlert('error', err?.message || 'Could not save profile.');
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save profile';
        }
      });
    });
  </script>
</body>
</html>
