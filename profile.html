<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Gig - PakGig</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="dashboard.html" class="text-2xl font-extrabold text-emerald-700 tracking-tight">Pak<span class="text-gray-900">Gig</span></a>
      <a href="dashboard.html" class="text-sm font-semibold text-gray-600 hover:text-emerald-700">Back to Dashboard</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-10">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Create a new gig</h1>
      <p class="text-sm text-gray-500 mb-6">List your service and start receiving orders securely.</p>

      <div id="alertBox" class="hidden p-3 rounded-lg text-xs font-medium border mb-6"></div>

      <form id="gigForm" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Gig title</label>
          <input id="title" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="e.g. WordPress website design" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Category</label>
          <select id="category" class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="web">Web & App Development</option>
            <option value="design">Graphics & Design</option>
            <option value="seo">Digital Marketing</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Description</label>
          <textarea id="description" required rows="5" class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Describe what you offer and what buyer gets."></textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Price (PKR)</label>
            <input id="price" type="number" min="1" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="5000" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Delivery days</label>
            <input id="deliveryDays" type="number" min="1" value="7" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>
        </div>
        <button type="submit" id="submitBtn" class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold rounded-lg shadow-md transition">Publish gig</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { requireLogin } from './js/session.js';
    import { createGig } from './js/data.js';

    const alertBox = document.getElementById('alertBox');
    const form = document.getElementById('gigForm');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(type, message) {
      const styles = type === 'success'
        ? 'bg-emerald-50 border-emerald-200 text-emerald-800'
        : 'bg-red-50 border-red-200 text-red-800';
      alertBox.className = 'p-3 rounded-lg text-xs font-medium border block ' + styles;
      alertBox.textContent = message;
    }

    requireLogin().then(() => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Publishing...';

        try {
          await createGig({
            title: document.getElementById('title').value.trim(),
            description: document.getElementById('description').value.trim(),
            category: document.getElementById('category').value,
            price: Number(document.getElementById('price').value),
            deliveryDays: Number(document.getElementById('deliveryDays').value)
          });

          showAlert('success', 'Gig published successfully.');
          form.reset();
          setTimeout(() => window.location.href = 'dashboard.html', 800);
        } catch (err) {
          showAlert('error', err?.message || 'Could not create gig.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Publish gig';
        }
      });
    });
  </script>
</body>
</html>
