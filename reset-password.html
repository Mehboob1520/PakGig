<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escrow - PakGig</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-extrabold text-emerald-700 tracking-tight">Pak<span class="text-gray-900">Gig</span></a>
      <a href="Services.html" class="text-sm font-semibold text-gray-600 hover:text-emerald-700">Explore services</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Escrow Protection</h1>
      <p class="text-sm text-gray-500 mb-6">Kept secure until both parties complete the work.</p>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4">
          <div class="font-bold text-emerald-800 mb-2">1. Buyer pays</div>
          <p class="text-emerald-700">Funds are held in escrow.</p>
        </div>
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4">
          <div class="font-bold text-blue-800 mb-2">2. Work is delivered</div>
          <p class="text-blue-700">Seller completes the job.</p>
        </div>
        <div class="bg-purple-50 border border-purple-200 rounded-xl p-4">
          <div class="font-bold text-purple-800 mb-2">3. Release payment</div>
          <p class="text-purple-700">Buyer releases funds after review.</p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
