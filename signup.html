<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PakGig - Join Free / Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-12 px-4">

    <div class="max-w-md w-full space-y-6 bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <!-- Header -->
        <div class="text-center space-y-2">
            <a href="index.html" class="text-3xl font-extrabold text-emerald-700 tracking-tight inline-block">Pak<span class="text-gray-900">Gig</span></a>
            <h2 class="text-xl font-bold text-gray-900">Create your account</h2>
            <p class="text-xs text-gray-500">Join Pakistan's premier 5% low-fee freelance marketplace</p>
        </div>

        <!-- Account Type Selector -->
        <div class="grid grid-cols-2 gap-2 bg-gray-100 p-1 rounded-xl text-xs font-semibold" id="roleSelector">
            <button id="btnBuyer" onclick="setRole('buyer')" class="py-2.5 rounded-lg bg-emerald-700 text-white shadow transition">Hire Talent (Client)</button>
            <button id="btnSeller" onclick="setRole('seller')" class="py-2.5 rounded-lg text-gray-600 hover:text-emerald-700 transition">Work as Freelancer</button>
        </div>

        <!-- Success/Error Alert -->
        <div id="alertBox" class="hidden p-3 rounded-lg text-xs font-medium border"></div>

        <!-- Signup Form -->
        <form id="signupForm" class="space-y-4">
            <input type="hidden" id="userRole" value="buyer">

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Full Name</label>
                <div class="relative">
                    <input type="text" id="fullName" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="e.g. Ali Raza">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="name@example.com">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" minlength="6" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="At least 6 characters">
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" id="terms" required class="w-4 h-4 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500">
                <label for="terms" class="text-xs text-gray-600">I agree to PakGig's <a href="#" class="text-emerald-700 underline">Terms</a> & <a href="#" class="text-emerald-700 underline">Privacy Policy</a></label>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold rounded-lg shadow-md transition flex justify-center items-center gap-2">
                <span>Create Account</span>
            </button>
        </form>

        <!-- Divider -->
        <div class="relative flex items-center justify-center my-4">
            <div class="border-t border-gray-200 w-full"></div>
            <span class="bg-white px-3 text-xs text-gray-400 absolute">OR</span>
        </div>

        <div class="text-center text-xs text-gray-600">
            Already have an account? <a href="login.html" class="font-semibold text-emerald-700 hover:underline">Sign In</a>
        </div>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-gray-400 hover:text-gray-600 inline-flex items-center gap-1">← Return to Home</a>
        </div>
    </div>

    <script>
        function setRole(role) {
            document.getElementById('userRole').value = role;
            const btnBuyer = document.getElementById('btnBuyer');
            const btnSeller = document.getElementById('btnSeller');

            if(role === 'buyer') {
                btnBuyer.className = "py-2.5 rounded-lg bg-emerald-700 text-white shadow transition";
                btnSeller.className = "py-2.5 rounded-lg text-gray-600 hover:text-emerald-700 transition";
            } else {
                btnSeller.className = "py-2.5 rounded-lg bg-emerald-700 text-white shadow transition";
                btnBuyer.className = "py-2.5 rounded-lg text-gray-600 hover:text-emerald-700 transition";
            }
        }
    </script>
    <script type="module">
        import { createUserWithEmailAndPassword, updateProfile, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { auth, db, isConfigured } from "./js/firebase.js";
        import { friendlyAuthError } from "./js/session.js";

        const alertBox = document.getElementById("alertBox");
        const submitBtn = document.getElementById("submitBtn");

        function showAlert(type, message) {
            const styles = type === "success"
                ? "bg-emerald-50 border-emerald-200 text-emerald-800"
                : "bg-red-50 border-red-200 text-red-800";
            alertBox.className = "p-3 rounded-lg text-xs font-medium border block " + styles;
            alertBox.textContent = message;
        }

        if (!isConfigured) {
            showAlert("error", "Firebase is not set up yet. Paste your Firebase config into js/firebase.js.");
        }

        document.getElementById("signupForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!isConfigured) return;

            const name = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const role = document.getElementById("userRole").value === "seller" ? "seller" : "buyer";

            submitBtn.disabled = true;
            submitBtn.textContent = "Creating account...";
            alertBox.className = "hidden";

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(cred.user, { displayName: name });

                // Profile document. If this fails (e.g. rules not published yet) the
                // account still works; profile.html creates the document on first visit.
                try {
                    await setDoc(doc(db, "users", cred.user.uid), {
                        fullName: name, email: email, role: role, createdAt: serverTimestamp()
                    });
                } catch (docErr) { console.warn("Profile document not saved:", docErr); }

                try { await sendEmailVerification(cred.user); } catch (mailErr) {}

                showAlert("success", "Welcome " + name + "! Account created. Redirecting...");
                setTimeout(() => { window.location.href = "Services.html"; }, 1200);
            } catch (err) {
                showAlert("error", friendlyAuthError(err.code));
                submitBtn.disabled = false;
                submitBtn.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
